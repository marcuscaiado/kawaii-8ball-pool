<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawaii 8-Ball Pool 🎱✨</title>
    <meta name="description" content="The cutest 8-ball pool game ever made!" />
    <script src="arcade-sound-engine.js"></script>
    <script src="arcade-difficulty.js"></script>
    <script src="arcade-leaderboard.js"></script>
    <script type="module" crossorigin src="/kawaii-8ball-pool/assets/index-DQDdyB4L.js"></script>
    <link rel="stylesheet" crossorigin href="/kawaii-8ball-pool/assets/index-DgfFsIXT.css">
  </head>
  <body>
    <!-- TOP NAVIGATION BAR -->
    <nav class="top-nav">
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="nav-btn arcade-link">🕹️ Arcade Hub</a>
    </nav>

    <div id="ui">
      <h1 class="game-title">✨ Kawaii Pool ✨</h1>
      <div class="player-info">
        <div class="player-panel active" id="p1-panel">
          <span class="player-label">Player 1</span>
          <span class="player-type" id="p1-type">🎱</span>
        </div>
        <div class="vs-badge">VS</div>
        <div class="player-panel" id="p2-panel">
          <span class="player-label">Player 2</span>
          <span class="player-type" id="p2-type">🎱</span>
        </div>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="message"></div>
    
    <!-- END ACTIONS -->
    <div id="end-actions-container" style="display: none;">
      <button id="play-again-btn" class="action-btn btn-primary">Play Again 🔄</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="action-btn btn-arcade">Arcade Hub 🕹️</a>
    </div>

    <div id="aim-hint">Click & drag on the white ball to shoot! 🎯</div>
  </body>
</html>
