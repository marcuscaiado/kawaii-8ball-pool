<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawaii 8-Ball Pool 🎱✨</title>
    <meta name="description" content="The cutest 8-ball pool game ever made!" />
    <script src="arcade-sound-engine.js"></script>
    <script src="arcade-difficulty.js"></script>
    <script src="arcade-leaderboard.js"></script>
  <style>
/* Universal Mobile Touch & Top Navigation Safeguards */
.arcade-nav, .arcade-link, .nav-btn-arcade, .arcade-corner-btn, .arcade-btn, .btn-arcade, a[href*="arcad"], #modal a, #modal button, .modal a, .modal button, #game-over-modal a, #game-over-modal button {
  pointer-events: auto !important;
  touch-action: auto !important;
  cursor: pointer !important;
  -webkit-tap-highlight-color: rgba(0, 245, 255, 0.4);
}
</style>
  <script type="module" crossorigin src="/kawaii-8ball-pool/assets/index-C4JFCnuI.js"></script>
  <link rel="stylesheet" crossorigin href="/kawaii-8ball-pool/assets/index-CG0ODqRG.css">
</head>
  <body>
    <!-- TOP NAVIGATION BAR -->
    <nav class="top-nav">
      <button id="online-btn" class="nav-btn btn-online">🌐 Online 1v1</button>
      <div id="room-badge" class="room-badge" style="display: none;">
        <span class="room-dot"></span>
        <span id="room-badge-text">ROOM: ----</span>
      </div>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="nav-btn arcade-link" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">🕹️ Arcade Hub</a>
    </nav>

    <div id="ui">
      <h1 class="game-title">✨ Kawaii Pool ✨</h1>
      <div class="player-info">
        <div class="player-panel active" id="p1-panel">
          <span class="player-label" id="p1-label">Player 1 🌸</span>
          <span class="player-type" id="p1-type">🎱</span>
        </div>
        <div class="vs-badge">VS</div>
        <div class="player-panel" id="p2-panel">
          <span class="player-label" id="p2-label">Player 2 🍓</span>
          <span class="player-type" id="p2-type">🎱</span>
        </div>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="message"></div>
    
    <!-- END ACTIONS -->
    <div id="end-actions-container" style="display: none;">
      <button id="play-again-btn" class="action-btn btn-primary">Play Again 🔄</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="action-btn btn-arcade" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">Arcade Hub 🕹️</a>
    </div>

    <div id="aim-hint">Click & drag on the white ball to shoot! 🎯</div>

    <!-- KAWAII EMOTE DOCK (ONLINE MODE) -->
    <div id="emote-dock" class="emote-dock" style="display: none;">
      <button class="emote-btn" data-emote="💖">💖</button>
      <button class="emote-btn" data-emote="✨">✨</button>
      <button class="emote-btn" data-emote="🎯">🎯</button>
      <button class="emote-btn" data-emote="🥺">🥺</button>
      <button class="emote-btn" data-emote="🎱">🎱</button>
    </div>

    <!-- ONLINE MULTIPLAYER MODAL -->
    <div id="online-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <button id="modal-close" class="modal-close-btn">&times;</button>
        <h2 class="modal-title">🎱 Online 1v1 P2P</h2>
        <p class="modal-subtitle">Play live with a friend across two devices with zero lag!</p>

        <div class="modal-tabs">
          <button id="tab-host" class="modal-tab active">Create Room</button>
          <button id="tab-join" class="modal-tab">Join Room</button>
        </div>

        <!-- Host Tab Panel -->
        <div id="panel-host" class="tab-panel active">
          <div class="room-code-display">
            <span class="code-label">YOUR ROOM CODE</span>
            <span id="host-code-text" class="code-value">----</span>
          </div>
          <button id="copy-link-btn" class="action-btn btn-primary" style="width: 100%; margin-top: 14px;">
            📋 Copy Invite Link
          </button>
          <p id="host-status" class="status-msg">🟡 Waiting for Player 2 to connect...</p>
        </div>

        <!-- Join Tab Panel -->
        <div id="panel-join" class="tab-panel">
          <div class="input-wrap">
            <input type="text" id="join-code-input" class="room-input" placeholder="ENTER 4-LETTER CODE" maxlength="8" />
          </div>
          <button id="join-room-btn" class="action-btn btn-arcade" style="width: 100%; margin-top: 14px;">
            Join Match 🎯
          </button>
          <p id="join-status" class="status-msg"></p>
        </div>

        <div class="modal-footer">
          <button id="local-mode-btn" class="btn-text">👥 Switch to Local Pass & Play</button>
        </div>
      </div>
    </div>
  </body>
</html>
